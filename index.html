<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mii Playground</title>
<style>
  :root {
    --panel: rgba(255, 255, 255, 0.78);
    --panel-border: rgba(120, 130, 150, 0.25);
    --ink: #2a2f3a;
    --accent: #3b82f6;
    --accent-ink: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: #eef1f7;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Title */
  #title {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 5;
  }
  #title h1 {
    margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.2px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
  }
  #title p { margin: 3px 0 0; font-size: 12.5px; opacity: 0.7; }

  /* Bottom control bar */
  #bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(238,241,247,0.95), rgba(238,241,247,0));
  }
  #buttons, #tools {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    max-width: 760px;
  }
  .anim-btn, .tool-btn, #importBtn {
    font: inherit; font-size: 14px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--panel-border);
    background: var(--panel); color: var(--ink);
    backdrop-filter: blur(8px); transition: all 0.15s ease;
    box-shadow: 0 1px 3px rgba(30,40,70,0.08);
  }
  .anim-btn:hover, .tool-btn:hover, #importBtn:hover {
    transform: translateY(-1px); box-shadow: 0 3px 8px rgba(30,40,70,0.14);
  }
  .anim-btn.active {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    box-shadow: 0 2px 10px rgba(59,130,246,0.4);
  }
  .anim-btn.imported { border-style: dashed; }
  .tool-btn, #importBtn { font-size: 13px; font-weight: 500; opacity: 0.92; }
  #status {
    font-size: 12px; opacity: 0.6; min-height: 15px; text-align: center;
  }

  /* Render-mode toggle */
  #modes { display: flex; gap: 6px; background: rgba(255,255,255,0.5);
    border: 1px solid var(--panel-border); border-radius: 999px; padding: 4px; backdrop-filter: blur(8px); }
  .mode-btn {
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 16px;
    border-radius: 999px; cursor: pointer; border: none; background: transparent; color: var(--ink);
    transition: all .15s ease;
  }
  .mode-btn.active { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 8px rgba(59,130,246,0.35); }

  /* Head-to-body ratio control */
  #ratio {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 8px 14px; backdrop-filter: blur(8px);
    box-shadow: 0 1px 3px rgba(30,40,70,0.08);
  }
  #ratio label { font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em; }
  #ratio #headVal { color: var(--accent); font-variant-numeric: tabular-nums; }
  #headSlider { width: 130px; accent-color: var(--accent); cursor: pointer; }
  #presets { display: flex; gap: 5px; }
  .ratio-btn {
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px;
    border-radius: 999px; cursor: pointer; border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.6); color: var(--ink); transition: all .12s ease;
  }
  .ratio-btn:hover { background: #fff; }
  .ratio-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Drag-and-drop overlay */
  #dropzone {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center;
    background: rgba(59,130,246,0.12); backdrop-filter: blur(3px);
    border: 4px dashed rgba(59,130,246,0.6);
  }
  #dropzone.show { display: flex; }
  #dropzone div {
    font-size: 20px; font-weight: 700; color: #1e3a8a;
    background: rgba(255,255,255,0.85); padding: 22px 34px; border-radius: 16px;
  }

  /* Help (top-right) */
  #help {
    position: fixed; top: 16px; right: 16px; z-index: 6;
    font-size: 12px; max-width: 220px; text-align: right;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 10px 12px; opacity: 0.9;
    backdrop-filter: blur(8px); line-height: 1.5;
  }
  #help b { color: var(--accent); }
  @media (max-width: 560px) { #help { display: none; } #title h1 { font-size: 18px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="title">
    <h1>Mii Playground</h1>
    <p>A rigged chibi character — click an animation</p>
  </div>

  <div id="help">
    Drag to orbit · scroll to zoom<br>
    Drop a <b>Mixamo</b> .fbx / .glb here to add it
  </div>

  <div id="bar">
    <div id="status"></div>
    <div id="modes"></div>
    <div id="buttons"></div>
    <div id="ratio">
      <label for="headSlider">Head size <span id="headVal">1×</span></label>
      <input id="headSlider" type="range" min="0.5" max="2" step="0.05" value="1">
      <!-- preset buttons injected by JS -->
    </div>
    <div id="tools">
      <button id="importBtn">📁 Import Mixamo clip</button>
    </div>
  </div>

  <div id="dropzone"><div>Drop your Mixamo animation to import ↓</div></div>
  <input type="file" id="fileInput" accept=".fbx,.glb,.gltf" style="display:none">
  <input type="file" id="faceInput" accept="image/*" style="display:none">

  <script type="module" src="./src/main.js"></script>
</body>
</html>
